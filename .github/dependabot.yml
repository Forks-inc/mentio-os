# A pull request when @mentio-dev/sdk publishes a new version (CI then shows
# whether the app still builds against it), and a weekly round for the rest.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-name: '@mentio-dev/sdk'
    labels: [sdk]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '@mentio-dev/sdk'
    groups:
      dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
